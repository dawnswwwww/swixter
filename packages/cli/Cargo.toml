[workspace]
resolver = "2"
members = ["crates/core", "crates/swixter"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
serde_yaml_ng = "0.10"
url = "2"
thiserror = "1"
dirs = "5"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dialoguer = "0.11"
console = "0.15"
semver = "1"
regex = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
strip = true
