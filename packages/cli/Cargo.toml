[workspace]
resolver = "2"
members = ["crates/core", "crates/swixter", "crates/proxy", "crates/server"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/dawnswwwww/swixter"
homepage = "https://github.com/dawnswwwww/swixter"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
serde_yaml_ng = "0.10"
url = "2"
thiserror = "1"
dirs = "5"
time = { version = "0.3", features = ["formatting", "parsing", "std", "macros"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dialoguer = "0.11"
console = "0.15"
semver = "1"
regex = "1"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
bytes = "1"
futures = "0.3"
dashmap = "6"
libc = "0.2"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
tokio-tungstenite = "0.26"
rust-embed = "8"
open = "5"
mime_guess = "2"

[profile.release]
lto = true
strip = true

[workspace.metadata.dist]
# 由 cargo-dist 维护；版本号必须与本机/CI 安装的 cargo-dist 一致（`cargo dist --version`），
# 0.28.0 为占位——首次运行 `cargo dist init`/`generate` 前按实际版本对齐
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell", "npm", "homebrew"]
# Homebrew tap 仓库——占位，需用户先在 GitHub 创建 dawnswwwww/homebrew-tap（见 Task 10 文档步骤）
tap = "dawnswwwww/homebrew-tap"
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
# 发布 job：npm 包 + homebrew formula（需 NPM_TOKEN secret 与 tap 仓库）
publish-jobs = ["homebrew", "npm"]
# PR 上只跑 dist plan，不构建产物
pr-run-mode = "plan"
# npm installer 包名与现行 npm 包一致（决策记录：npm 包名不变）
npm-package = "swixter"
