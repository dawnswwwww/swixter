[package]
name = "swixter-proxy"
description = "Anthropic/OpenAI protocol-transforming failover proxy for swixter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
swixter-core = { path = "../core" }
tokio.workspace = true
axum.workspace = true
reqwest.workspace = true
bytes.workspace = true
futures.workspace = true
dashmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile.workspace = true
