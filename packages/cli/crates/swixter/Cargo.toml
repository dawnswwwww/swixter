[package]
name = "swixter"
description = "CLI tool for managing AI coding assistant configurations - switch between providers (Claude Code, Codex, Continue) with Anthropic, Ollama, or custom APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["claude", "codex", "llm", "config", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "swixter"
path = "src/main.rs"

[dependencies]
swixter-core = { version = "0.2.2", path = "../core" }
swixter-proxy = { version = "0.2.2", path = "../proxy" }
swixter-server = { version = "0.2.2", path = "../server" }
clap.workspace = true
clap_complete.workspace = true
dialoguer.workspace = true
console.workspace = true
semver.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
tokio.workspace = true
libc.workspace = true
# 交互向导 base URL 校验（与 core validate 同源：WHATWG URL 解析）
url.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

# dist 的 package-local 配置：musl target 构建需要 musl-gcc（ring 的 C 编译
# 经 cc-rs 调用 musl-gcc），GH runner 默认不带 musl-tools，按 target 限定安装
[package.metadata.dist.dependencies.apt]
musl-tools = { version = "*", targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"] }
