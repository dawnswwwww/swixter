name: Publish crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish (dependency order)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION=$(grep -A5 '\[workspace.package\]' packages/cli/Cargo.toml | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "tag: ${TAG_VERSION}, workspace: ${WORKSPACE_VERSION}"
          if [ "$TAG_VERSION" != "$WORKSPACE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match workspace.package.version ${WORKSPACE_VERSION}"
            exit 1
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish swixter-core
        working-directory: packages/cli
        run: cargo publish -p swixter-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish swixter-proxy
        working-directory: packages/cli
        run: cargo publish -p swixter-proxy --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish swixter-server
        working-directory: packages/cli
        run: cargo publish -p swixter-server --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish swixter
        working-directory: packages/cli
        run: cargo publish -p swixter --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
